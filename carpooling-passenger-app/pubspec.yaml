name: carpooling_passenger_app
description: "Carpooling Passenger Flutter Mobile Application"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  get_it: ^7.6.0

  # Networking
  dio: ^5.4.0
  pretty_dio_logger: ^1.3.1

  # Storage & Security
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # Firebase Realtime Tracking
  firebase_core: ^2.27.0
  firebase_database: ^10.4.9
  firebase_auth: ^4.17.8

  # Location, Maps & Device
  geolocator: ^10.1.0
  permission_handler: ^11.2.0

  # Utilities & UI
  flutter_dotenv: ^5.1.0
  intl: ^0.19.0
  uuid: ^4.3.3
  cached_network_image: ^3.3.1
  flutter_spinkit: ^5.2.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icons/
    - assets/images/
